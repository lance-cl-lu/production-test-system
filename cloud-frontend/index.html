<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172554">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Production Test Cloud</title>
  <style>
    body{font:14px system-ui;margin:0;background:#f5f7fa;color:#1f2937}header{background:#172554;color:white;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;font-size:20px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:30px;height:30px}.language{display:flex;gap:6px}.language button{margin:0;padding:6px 10px;color:white;border:1px solid #93c5fd;background:transparent;border-radius:4px;cursor:pointer}.language button.active{color:#172554;background:white}
    main{padding:24px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:white;border-radius:8px;padding:18px;box-shadow:0 1px 4px #0001}.value{font-size:28px;font-weight:700;margin-top:8px}
    .table-wrap{overflow:auto;margin-top:20px;background:white;border-radius:8px}table{border-collapse:collapse;min-width:1900px;width:100%}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:center;white-space:nowrap}th{background:#f8fafc;position:sticky;top:0}.pass{color:#15803d}.fail{color:#b91c1c}.pending{color:#a16207}
    button{padding:8px 14px;margin-bottom:12px}.expand{width:28px;height:28px;padding:0;margin:0;border:1px solid #94a3b8;border-radius:4px;background:white;cursor:pointer}.detail-row{display:none}.detail-row.open{display:table-row}.detail-cell{padding:14px 48px;background:#f8fafc}.detail-table{min-width:800px}.detail-table th{position:static;background:#e2e8f0}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body><header><div class="brand"><img src="/favicon.svg" alt=""><span id="title"></span></div><div class="language"><button id="lang-zh" onclick="setLanguage('zh-TW')">中文</button><button id="lang-en" onclick="setLanguage('en-US')">English</button></div></header><main>
  <button id="refresh" onclick="loadAll()"></button><div class="stats" id="stats"></div>
  <div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
</main><script src="/config.js"></script><script>
const api=window.CLOUD_API_URL||`http://${location.hostname}:8100`; const stages=['getSensorIC','sht41','ens210','lps22df','bme690','testButton','testGreenLED','testOrangeLED','testBuzzer','testSPI'];
const messages={
  'zh-TW':{title:'生產測試雲端紀錄',refresh:'重新整理',total:'總測試數',passed:'通過數',failed:'失敗數',pending:'待測試數',rate:'良率',wle:'WLE 序號',wba:'WBA 序號',result:'測試結果',time:'測試時間',item:'項目',temperature:'溫度 (°C)',humidity:'濕度 (%)',pressure:'氣壓 (hPa)',gas:'氣體電阻 (Ω)',error:'無法連線雲端模擬器',statuses:{pass:'通過',fail:'失敗',pending:'待測試'},stages:{getSensorIC:'讀取 Sensor IC',sht41:'sht41',ens210:'ens210',lps22df:'lps22df',bme690:'bme690',testButton:'測試按鈕',testGreenLED:'測試藍色 LED',testOrangeLED:'測試橙色 LED',testBuzzer:'測試蜂鳴器',testSPI:'測試 SPI'}},
  'en-US':{title:'Production Test Cloud Records',refresh:'Refresh',total:'Total Tests',passed:'Passed',failed:'Failed',pending:'Pending',rate:'Pass Rate',wle:'WLE Serial',wba:'WBA Serial',result:'Test Result',time:'Test Time',item:'Item',temperature:'Temperature (°C)',humidity:'Humidity (%)',pressure:'Pressure (hPa)',gas:'Gas Resistance (Ω)',error:'Unable to connect to cloud simulator',statuses:{pass:'PASS',fail:'FAIL',pending:'PENDING'},stages:{getSensorIC:'Read Sensor IC',sht41:'sht41',ens210:'ens210',lps22df:'lps22df',bme690:'bme690',testButton:'Test Button',testGreenLED:'Test Blue LED',testOrangeLED:'Test Orange LED',testBuzzer:'Test Buzzer',testSPI:'Test SPI'}}
};
let language=localStorage.getItem('cloud-language')||((navigator.language||'').startsWith('zh')?'zh-TW':'en-US');let latestStats=null,latestRuns=null;
function text(){return messages[language]}
function tag(v){v=v||'';const key=v.toLowerCase();return v?`<b class="${key}">${text().statuses[key]||v.toUpperCase()}</b>`:'-'} function dt(v){return v?new Date(v).toLocaleString(language,{timeZone:'Asia/Taipei',hour12:false}):'-'}
function value(v){return v===null||v===undefined?'-':Number(v).toFixed(2)}
function toggleDetail(id,button){const row=document.getElementById(id);const open=row.classList.toggle('open');button.textContent=open?'−':'+';button.setAttribute('aria-expanded',String(open))}
function details(run){const t=text(),sensors=['sht41','ens210','lps22df','bme690'];const rows=sensors.map(stage=>{const item=run.items.find(i=>i.stage===stage)||{};return `<tr><td>${t.stages[stage]}</td><td>${tag(item.status)}</td><td>${value(item.temperature_c)}</td><td>${value(item.humidity_percent)}</td><td>${value(item.pressure_hpa)}</td><td>${value(item.gas_resistance_ohm)}</td></tr>`}).join('');return `<table class="detail-table"><thead><tr><th>${t.item}</th><th>${t.result}</th><th>${t.temperature}</th><th>${t.humidity}</th><th>${t.pressure}</th><th>${t.gas}</th></tr></thead><tbody>${rows}</tbody></table>`}
function render(){const t=text();document.documentElement.lang=language;document.title=t.title;document.querySelector('#title').textContent=t.title;document.querySelector('#refresh').textContent=t.refresh;document.querySelector('#lang-zh').classList.toggle('active',language==='zh-TW');document.querySelector('#lang-en').classList.toggle('active',language==='en-US');if(!latestStats||!latestRuns)return;const s=latestStats,r=latestRuns;document.querySelector('#stats').innerHTML=[[t.total,s.total],[t.passed,s.passed],[t.failed,s.failed],[t.pending,s.pending],[t.rate,s.pass_rate+'%']].map(x=>`<div class="card">${x[0]}<div class="value">${x[1]}</div></div>`).join('');document.querySelector('#head').innerHTML=['',t.wle,t.wba,t.result,t.time,...stages.map(x=>t.stages[x])].map(x=>`<th>${x}</th>`).join('');document.querySelector('#body').innerHTML=r.map((run,index)=>{const m=Object.fromEntries(run.items.map(i=>[i.stage,i.status]));const id=`detail-${index}`;return `<tr><td><button class="expand" aria-expanded="false" onclick="toggleDetail('${id}',this)">+</button></td><td>${run.serial_wle}</td><td>${run.serial_wba||'-'}</td><td>${tag(run.test_result)}</td><td>${dt(run.started_at)}</td>${stages.map(x=>`<td>${tag(m[x])}</td>`).join('')}</tr><tr id="${id}" class="detail-row"><td class="detail-cell" colspan="15">${details(run)}</td></tr>`}).join('')}
function setLanguage(next){language=next;localStorage.setItem('cloud-language',next);render()}
async function loadAll(){try{[latestStats,latestRuns]=await Promise.all([fetch(api+'/api/v1/dashboard/stats').then(x=>x.json()),fetch(api+'/api/v1/sensor-runs').then(x=>x.json())]);render()}catch(e){document.querySelector('#stats').innerHTML=`<div class="card fail">${text().error}</div>`}} render();loadAll();setInterval(loadAll,30000);
</script></body></html>
