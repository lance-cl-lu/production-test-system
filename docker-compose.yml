services:
  mysql:
    image: mysql:8.0
    container_name: production_test_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-production_test}
      MYSQL_USER: ${MYSQL_USER:-testuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testpassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build: ./backend
    container_name: production_test_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-testuser}:${MYSQL_PASSWORD:-testpassword}@mysql:3306/${MYSQL_DATABASE:-production_test}
      CLOUD_UPLOAD_ENABLED: ${CLOUD_UPLOAD_ENABLED:-false}
      CLOUD_API_URL: ${CLOUD_API_URL:-http://cloud-receiver:8100/api/v1/sync/batch}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-local-cloud-key}
      CLOUD_SYNC_INTERVAL_SECONDS: ${CLOUD_SYNC_INTERVAL_SECONDS:-10}
    depends_on:
      - mysql
    volumes:
      - ./backend:/app
      - ./shared:/shared
    stdin_open: true
    tty: true

  cloud-mysql:
    image: mysql:8.0
    container_name: production_test_cloud_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${CLOUD_MYSQL_ROOT_PASSWORD:-cloudrootpassword}
      MYSQL_DATABASE: ${CLOUD_MYSQL_DATABASE:-production_test_cloud}
      MYSQL_USER: ${CLOUD_MYSQL_USER:-clouduser}
      MYSQL_PASSWORD: ${CLOUD_MYSQL_PASSWORD:-cloudpassword}
    ports:
      - "127.0.0.1:${CLOUD_MYSQL_PORT:-3307}:3306"
    volumes:
      - cloud_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  cloud-receiver:
    build: ./cloud-receiver
    container_name: production_test_cloud_receiver
    restart: always
    ports:
      - "127.0.0.1:${CLOUD_API_PORT:-8100}:8100"
    environment:
      DATABASE_URL: mysql+pymysql://${CLOUD_MYSQL_USER:-clouduser}:${CLOUD_MYSQL_PASSWORD:-cloudpassword}@cloud-mysql:3306/${CLOUD_MYSQL_DATABASE:-production_test_cloud}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-local-cloud-key}
    depends_on:
      - cloud-mysql

  cloud-frontend:
    build: ./cloud-frontend
    container_name: production_test_cloud_frontend
    restart: always
    ports:
      - "127.0.0.1:${CLOUD_FRONTEND_PORT:-3100}:80"
    environment:
      CLOUD_PUBLIC_API_URL: ${CLOUD_PUBLIC_API_URL:-http://localhost:8100}
      NGINX_ENVSUBST_OUTPUT_DIR: /usr/share/nginx/html
    depends_on:
      - cloud-receiver

  frontend-smac:
    build: ./frontend-smac
    container_name: production_test_frontend_smac
    restart: always
    ports:
      - "${FRONTEND_SMAC_PORT:-3000}:3000"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
      DISABLE_ESLINT_PLUGIN: "true"
      GENERATE_SOURCEMAP: "false"
    depends_on:
      - backend
    volumes:
      - ./frontend-smac/src:/app/src
      - ./frontend-smac/public:/app/public
    stdin_open: true
    tty: true

  frontend-nl:
    build: ./frontend-nl
    container_name: production_test_frontend_nl
    restart: always
    ports:
      - "${FRONTEND_NL_PORT:-3001}:3001"
    environment:
      PORT: 3001
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    volumes:
      - ./frontend-nl/src:/app/src
      - ./frontend-nl/public:/app/public
    stdin_open: true
    tty: true

volumes:
  mysql_data:
  cloud_mysql_data:
